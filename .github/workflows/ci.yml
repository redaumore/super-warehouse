name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ferreteria
          POSTGRES_PASSWORD: ferreteria
          POSTGRES_DB: ferreteria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferreteria -d ferreteria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test
        env:
          DATABASE_URL: postgresql+psycopg://ferreteria:ferreteria@localhost:5432/ferreteria
        run: pytest

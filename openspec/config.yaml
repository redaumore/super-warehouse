# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: greenfield / undecided (no source code, no package manager, no framework)
  Architecture: undecided
  Testing: none detected
  Style: undecided
  Persistence mode: hybrid (OpenSpec files + Engram)
  Product source: docs/ (MVP for a ferretería / hardware store management system)

testing:
  strict_tdd: false
  test_runner: none
  coverage: none
  linter: none
  typechecker: none
  formatter: none

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns once a stack is chosen
    tdd: false           # No test runner available yet
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

[project]
name = "super-warehouse"
version = "0.1.0"
description = "Ferretería (hardware store) multi-agent MVP: WhatsApp/Telegram intake, pricing, order lifecycle, backoffice."
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21",
    "httpx>=0.27",
    "phonenumbers>=8.13",
    "email-validator>=2",
    "rapidfuzz>=3.6",
    "apscheduler>=3.10,<4",
    "openai>=1.30",
    "gspread>=6.0",
    "gradio>=4.0",
    "pyzbar>=0.1.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.8",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
extraPaths = ["."]

# Modular-monolith boundary enforcement (Phase 0).
# Layers, highest first; lower layers must not import higher ones.
# Siblings within a layer are separated by ':' (non-independent), so same-layer
# imports are unrestricted here — per-module neighbor rules come in later phases.
[tool.importlinter]
# pricing/purchasing/sourcing/supplier/barcode are namespace packages (no __init__.py)
# and grimp does not discover them on its own; they must be listed as roots explicitly.
root_packages = ["src", "src.pricing", "src.purchasing", "src.sourcing", "src.supplier", "src.barcode"]

[[tool.importlinter.contracts]]
name = "modular monolith layers"
type = "layers"
layers = [
    # L3 interface
    "src.pipeline : src.api : src.backoffice : src.scheduler : src.barcode",
    # L2 adapters
    "src.integrations",
    # L1 domain
    "src.agents : src.orchestrator : src.sourcing : src.purchasing : src.supplier : src.pricing : src.order_lifecycle : src.channels",
    # L0 foundation (src.shared holds the pure cross-module contract types)
    "src.shared : src.db : src.observability : src.features : src.config : src.tz",
]

# Per-module neighbor rules (Phase 2, PR 4): forbidden same-layer imports.
# The orchestrator is the composition root — it imports agents/sourcing/supplier
# in the legal direction — so domain modules must not reach back into it or
# into each other except the reserved I/O edges ignored below.
[[tool.importlinter.contracts]]
name = "agents forbidden neighbors"
type = "forbidden"
source_modules = ["src.agents"]
forbidden_modules = ["src.orchestrator", "src.sourcing"]
# Neighbor rules govern DIRECT imports: agents compose through permitted edges
# (e.g. order_lifecycle -> purchasing -> sourcing) without importing the
# neighbor directly. Sourcing/supplier contracts keep strict indirect checking.
allow_indirect_imports = true
ignore_imports = [
    # reserved: becomes a LangGraph node connection (confirm ceremony)
    "src.agents.dispatch -> src.orchestrator.approval",
]

[[tool.importlinter.contracts]]
name = "sourcing forbidden neighbors"
type = "forbidden"
source_modules = ["src.sourcing"]
forbidden_modules = ["src.orchestrator", "src.agents"]

[[tool.importlinter.contracts]]
name = "supplier forbidden neighbors (leaf domain)"
type = "forbidden"
source_modules = ["src.supplier"]
forbidden_modules = ["src.agents", "src.orchestrator", "src.sourcing"]
ignore_imports = [
    # reserved: becomes a LangGraph node connection (vision I/O)
    "src.supplier.ocr -> src.agents.perception",
]

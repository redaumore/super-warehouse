[project]
name = "super-warehouse"
version = "0.1.0"
description = "Ferretería (hardware store) multi-agent MVP: WhatsApp/Telegram intake, pricing, order lifecycle, backoffice."
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "python-telegram-bot>=21",
    "httpx>=0.27",
    "phonenumbers>=8.13",
    "email-validator>=2",
    "rapidfuzz>=3.6",
    "apscheduler>=3.10,<4",
    "openai>=1.30",
    "gspread>=6.0",
    "gradio>=4.0",
    "pyzbar>=0.1.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
extraPaths = ["."]

# Modular-monolith boundary enforcement (Phase 0).
# Layers, highest first; lower layers must not import higher ones.
# Siblings within a layer are separated by ':' (non-independent), so same-layer
# imports are unrestricted here — per-module neighbor rules come in later phases.
[tool.importlinter]
# pricing/purchasing/sourcing/supplier/barcode are namespace packages (no __init__.py)
# and grimp does not discover them on its own; they must be listed as roots explicitly.
root_packages = ["src", "src.pricing", "src.purchasing", "src.sourcing", "src.supplier", "src.barcode"]

[[tool.importlinter.contracts]]
name = "modular monolith layers"
type = "layers"
layers = [
    # L3 interface
    "src.pipeline : src.api : src.backoffice : src.scheduler : src.barcode",
    # L2 adapters
    "src.integrations",
    # L1 domain
    "src.agents : src.orchestrator : src.sourcing : src.purchasing : src.supplier : src.pricing : src.order_lifecycle : src.channels",
    # L0 foundation
    "src.db : src.observability : src.features : src.config : src.tz",
]

# KNOWN VIOLATIONS — temporary debt, to be removed in later phases (phase-1+ cycle fixes).
# Grouped by the higher offending layer. Each entry is an import that exists today.
ignore_imports = [
    # L1 -> L2 (agents using adapters directly)
    "src.agents.product_search -> src.integrations.rag",
    "src.agents.customer -> src.integrations.rag",
    "src.supplier.rag_searcher -> src.integrations.rag",
    "src.sourcing.draft_order -> src.integrations.rag",
]
